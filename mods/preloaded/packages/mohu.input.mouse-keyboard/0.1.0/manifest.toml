description = "Click to capture; Escape releases. R reloads, wheel cycles, 1-8 select weapons. Menus: WASD, E confirm, Q back. Right mouse scopes the sniper only."
channel = "experimental"
default_enabled = false

[[plugin]]
feature = "mouse-keyboard"
id = "mohu.input.mouse-keyboard"
