format_version = 11
id = "mohu.input.mouse-keyboard"
version = "0.1.0"
name = "Mouse and keyboard gameplay"
author = "Medal-Of-Honor-Underground-PSX-Recomp"
description = "Experimental direct mouse look, WASD movement, native actions, and an always-on ordinary-weapon reticle."
license = "MIT"
resolver = "declarative"

[[target]]
game_id = "SLUS-01270"

[[feature]]
id = "mouse-keyboard"
name = "Mouse and keyboard"
description = "Click to capture; Escape releases. R reloads, wheel cycles, 1-8 select weapons. Menus: WASD, E confirm, Q back. Right mouse scopes the sniper only."
channel = "experimental"
default_enabled = false

[[option]]
feature = "mouse-keyboard"
id = "sensitivity"
label = "Mouse sensitivity"
description = "Turn rate in percent of one native angle unit per mouse count. 50 is about 0.044 degrees per count. No acceleration or smoothing."
type = "integer"
min = 1
max = 400
step = 1
default = 50

[[option]]
feature = "mouse-keyboard"
id = "scoped_sensitivity"
label = "Scoped sensitivity"
description = "Percent of the zoom-adjusted mouse sensitivity. 100 preserves screen-space sensitivity as the native scope zoom changes."
type = "integer"
min = 1
max = 200
step = 1
default = 100

[[plugin]]
feature = "mouse-keyboard"
id = "mohu.input.mouse-keyboard"
