format_version = 12
id = "mohu.input.mouse-keyboard"
version = "0.1.0"
name = "Mouse and keyboard gameplay"
author = "Medal-Of-Honor-Underground-PSX-Recomp"
description = "Experimental direct mouse look, WASD movement, native actions, firearm zoom and an aiming-only native reticle."
license = "MIT"
resolver = "declarative"

[[target]]
game_id = "SLUS-01270"

[[feature]]
id = "mouse-keyboard"
name = "Mouse and keyboard"
description = "Click to capture; Escape releases. R reloads and wheel cycles weapons. Menus: WASD, E confirm, Q back. Right mouse smoothly zooms firearms/crossbow 1.25x or uses the native sniper scope."
channel = "experimental"
default_enabled = false

[[option]]
feature = "mouse-keyboard"
id = "look_sensitivity"
label = "Global mouse sensitivity"
description = "Independent 1-10 turn rate. Global 5 keeps the original feel; aiming 4 is slightly slower. Equal values give equal screen movement. No acceleration or smoothing."
group = "Sensitivity"
type = "integer"
min = 1
max = 10
step = 1
slider = true
default = 5

[[option]]
feature = "mouse-keyboard"
id = "aim_sensitivity"
label = "Aiming sensitivity"
description = "Independent 1-10 turn rate. Global 5 keeps the original feel; aiming 4 is slightly slower. Equal values give equal screen movement. No acceleration or smoothing."
group = "Sensitivity"
type = "integer"
min = 1
max = 10
step = 1
slider = true
default = 4

[[option]]
feature = "mouse-keyboard"
id = "bind_forward"
label = "Forward"
description = "Click a binding and press a key or mouse button. Right-click clears; Reset restores this action. Escape cancels capture. Up to three alternatives."
group = "Movement"
type = "binding"
default = "key:26"

